services:
  # ============ POSTGRESQL ============
  postgres:
    image: postgres:15
    container_name: bi_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-bi_recommendation}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-bi_recommendation}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bi_network

  # ============ RABBITMQ ============
  rabbitmq:
    image: rabbitmq:3-management
    container_name: bi_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bi_network

  # ============ METABASE ============
  metabase:
    image: metabase/metabase:latest
    container_name: bi_metabase
    restart: always
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${DB_NAME:-bi_recommendation}
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_USER: ${DB_USER:-admin}
      MB_DB_PASS: ${DB_PASSWORD:-admin123}
    ports:
      - "${METABASE_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metabase_data:/metabase-data
    networks:
      - bi_network

  # ============ BACKEND API ============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bi_backend
    restart: always
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-admin}:${DB_PASSWORD:-admin123}@postgres:5432/${DB_NAME:-bi_recommendation}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      DB_NAME: ${DB_NAME:-bi_recommendation}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend:/app
    networks:
      - bi_network

  # ============ PUBLISHER (Metabase → RabbitMQ) ============
  publisher:
    build:
      context: ./backend/rabbitmq
      dockerfile: Dockerfile
    container_name: bi_publisher
    command: python publisher.py
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      METABASE_URL: http://metabase:3000
      METABASE_USER: ${METABASE_ADMIN_USER:-admin@bi.local}
      METABASE_PASS: ${METABASE_ADMIN_PASS:-metabase123}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      DB_HOST: postgres
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      DB_NAME: ${DB_NAME:-bi_recommendation}
      POLL_INTERVAL: ${POLL_INTERVAL:-5}
      USE_MOCK: ${USE_MOCK:-false}
      SIMULATE_DURATION: ${SIMULATE_DURATION:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - bi_network

  # ============ CONSUMER (RabbitMQ → PostgreSQL) ============
  consumer:
    build:
      context: ./backend/rabbitmq
      dockerfile: Dockerfile
    container_name: bi_consumer
    command: python consumer.py
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      DB_NAME: ${DB_NAME:-bi_recommendation}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - bi_network

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  metabase_data:
    driver: local

networks:
  bi_network:
    driver: bridge
