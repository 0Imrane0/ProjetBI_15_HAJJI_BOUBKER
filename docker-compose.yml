
services:

  postgres:
    image: postgres:15
    container_name: bi_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: bi_recommendation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: bi_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  metabase:
    image: metabase/metabase:latest
    container_name: bi_metabase
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  backend:
    build: ./backend
    container_name: bi_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/bi_recommendation
volumes:
  postgres_data: